<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Editar Produto</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <h1>Editar Produto</h1>

    <form method="POST">

        <label>Nome:</label>
        <input type="text" name="nome" value="{{ produto[1] }}" required>

        <br><br>

        <label>Descrição:</label>
        <input type="text" name="descricao" value="{{ produto[2] }}">

        <br><br>

        <label>Estoque atual:</label>
        <input type="number" name="quantidade" value="{{ produto[3] }}" min="0" required>

        <br><br>

        <label>Estoque mínimo:</label>
        <input type="number" name="estoque_minimo" value="{{ produto[4] }}" min="0" required>

        <br><br>

        <button type="submit">Salvar alterações</button>

    </form>

    <br>

    <a href="/produtos">Voltar para produtos</a>

</body>
</html>
